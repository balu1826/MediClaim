openapi: 3.0.3

info:
  title: MediClaim API
  version: 1.0.0
  description: Enterprise Claims Processing API

  contact:
    name: API Support Team
    email: api-support@company.com

  x-api-id: 6f6c8df0-4d7e-4df7-8f3e-9f53f2bbf111
  x-business-unit: INSURANCE
  x-compliance-level: HIPAA
  x-data-classification: CONFIDENTIAL

servers:
  - url: https://localhost:44312
    description: Local Development

tags:
  - name: Claims
    description: Claim workflow operations

x-rate-limit:
  requests-per-minute: 1000
  burst: 100

x-sla:
  availability: 99.95
  response-time-p95: 200ms

paths:

  /v1/claims/{claimId}/submit:

    post:

      tags:
        - Claims

      summary: Submit draft claim

      description: Transitions claim from Draft state to Submitted state

      operationId: submitClaim

      security:
        - bearerAuth: []

      parameters:

        - name: claimId
          in: path
          required: true
          description: Unique claim identifier

          schema:
            type: string
            format: uuid

          example: "11111111-1111-1111-1111-111111111111"

        - $ref: '#/components/parameters/CorrelationIdHeader'

        - $ref: '#/components/parameters/IdempotencyKeyHeader'

      responses:

        '204':
          description: Claim submitted successfully

          headers:

            X-Correlation-ID:
              description: Correlation identifier for request tracing

              schema:
                type: string

        '400':
          description: Validation failure

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ProblemDetails'

              examples:

                ValidationFailure:

                  value:
                    traceId: "abc123"
                    errorCode: "CLAIM_VALIDATION_FAILED"
                    message: "Claim already submitted"

        '401':
          description: Unauthorized request

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ProblemDetails'

        '404':
          description: Claim not found

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ProblemDetails'

        '422':
          description: Claim already submitted

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ProblemDetails'

        '429':
          description: Rate limit exceeded

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ProblemDetails'

        '500':
          description: Internal server error

          

          schema:
                $ref: '#/components/schemas/ProblemDetails'

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    CorrelationIdHeader:

      name: X-Correlation-ID
      in: header
      required: true

      description: Correlation identifier used for distributed tracing

      schema:
        type: string

      example: "corr-123456"

    IdempotencyKeyHeader:

      name: Idempotency-Key
      in: header
      required: true

      description: Prevents duplicate claim submissions

      schema:
        type: string

      example: "idem-123456"

  schemas:

    ProblemDetails:

  type: object

  properties:

    type:
      type: string

    title:
      type: string

    status:
      type: integer

    detail:
      type: string

    instance:
      type: string

  additionalProperties: true